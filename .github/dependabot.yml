version: 2
updates:
  # The package has no PHP dependencies besides Neos and Flow, and the root
  # package.json only holds the standard-version release scripts. Composer
  # updates only run for 1.x: on main, neos/neos ^9.0 can't be resolved on its
  # own (it needs a neos/contentrepositoryregistry-storageclient, which a
  # distribution provides), so Dependabot's composer job always fails there.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: composer
    directory: /
    target-branch: 1.x
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      composer-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: 1.x
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
